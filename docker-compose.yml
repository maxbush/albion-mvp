version: "3.9"
services:
  # Postgres для production-режима (этап 1, PR3). SQLite остаётся
  # дефолтом — DATABASE_URL на postgres включает PG-диалект.
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: albion
      POSTGRES_USER: albion
      # пароль — из .env (POSTGRES_PASSWORD=…), дефолта нет: compose упадёт
      # с понятной ошибкой, если переменная не задана
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD в .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped

  albion:
    build: .
    env_file: .env
    # Для PG-режима в .env:
    #   DATABASE_URL=postgresql://albion:<POSTGRES_PASSWORD>@db:5432/albion
    # Для sqlite-режима (дефолт) volume ниже сохраняет файл между рестартами.
    volumes:
      - ./albion.db:/app/albion.db
      - ./albion.log:/app/albion.log
    depends_on:
      - db
    restart: unless-stopped

volumes:
  pgdata:
