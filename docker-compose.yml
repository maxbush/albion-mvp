version: "3.9"
services:
  # Postgres для production-режима (этап 1, PR3). SQLite остаётся
  # дефолтом — DATABASE_URL на postgres включает PG-диалект.
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: albion
      POSTGRES_USER: albion
      POSTGRES_PASSWORD: albion
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped

  albion:
    build: .
    env_file: .env
    # Для PG-режима в .env:
    #   DATABASE_URL=postgresql://albion:albion@db:5432/albion
    # Для sqlite-режима (дефолт) volume ниже сохраняет файл между рестартами.
    volumes:
      - ./albion.db:/app/albion.db
      - ./albion.log:/app/albion.log
    depends_on:
      - db
    restart: unless-stopped

volumes:
  pgdata:
